.side{padding:16px;border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 56px)}
.paper{position:relative;background:var(--paper);

.zoom{position:absolute;right:0;top:6px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:18px;line-height:1}
.zoom button.txt{width:auto;padding:0 10px;font-size:12.5px}
.tl{position:relative;height:44px;margin:2px 4% 0}
.tl .track{position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:linear-gradient(90deg,#D9C39A 0 30%,var(--navy) 42% 100%)}
.tl .dot{position:absolute;top:2px;width:19px;height:19px;margin-left:-9px;border-radius:50%;background:var(--paper);border:2px solid var(--red);display:grid;place-items:center}
.tl .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
.tl span{position:absolute;top:22px;transform:translateX(-50%);font-family:var(--hand);font-size:15px;color:var(--mute);white-space:nowrap}
.foot{font-family:var(--hand);color:var(--mute);font-size:15px;margin-top:2px}

.hand{font-family:var(--hand);font-size:17px;line-height:1.35;margin:0 0 6px}
.btn{display:block;width:100%;border:1px solid var(--red);background:var(--paper);color:var(--red);border-radius:999px;padding:8px 14px;font-weight:500;text-align:center}

.card h5 em{font-style:normal;font-weight:500;color:var(--mute);font-size:12.5px;white-space:nowrap}
.card p{margin:3px 0 0;color:var(--mute);font-size:12.5px}

.hrow{display:flex;gap:10px;align-items:flex-start}.av{flex:none;display:block}.hmain{flex:1;min-width:0}
.hc.off{opacity:.62}.hc .st{grid-template-columns:auto 1fr}
.badge{display:inline-block;font-size:11px;font-weight:500;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;line-height:17px}
.b1{background:#F6D8D3;color:#8E1F1B}.b2{background:#F2E1B5;color:#7A5212}.boff{background:#E6E0D2;color:#7A6D5E}

.ebar{height:6px;border-radius:3px;background:#E6DFD0;overflow:hidden}.ebar i{display:block;height:100%}
.rv{font-size:12px!important;margin:4px 0 0!important}
.hb{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.tog{border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12px;padding:3px 11px;font-weight:500;color:var(--mute)}
.tog.on{background:#3F8F7B;border-color:#3F8F7B;color:#fff}
.goalc{background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.goalc small{display:block;font-size:11px;letter-spacing:.1em;opacity:.7}.goalc b{display:block;font-family:var(--serif);font-weight:400;font-size:18px;margin:2px 0}.goalc span{font-size:12.5px;color:#F2C94C}

.wk .cur{color:var(--ink);font-weight:700}.wk .cur i{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 8px}.stats div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.stats small{display:block;font-size:11px;color:var(--mute)}.stats b{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.sl{margin:6px 0 0;color:var(--mute);font-size:12.5px}
.sheet{max-height:86vh;overflow:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--mute)}
.pips{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.pips i{width:5px;height:9px;border-radius:1px;background:var(--line)}
.pips i.on{background:var(--red2)}

.seg button{flex:1;border:0;background:none;padding:5px 4px;font-size:12.5px}
.seg button.on{background:var(--ink);color:var(--paper)}
.link{border:0;background:none;color:var(--mute);text-decoration:underline;padding:0;font-size:12px}
.price{font-family:var(--serif);font-size:28px;line-height:1}

.goal{font-family:var(--hand);font-size:16px}

.rowbtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px dashed var(--line);background:none;padding:6px 0;text-align:left}
.rowbtn em{font-style:normal;color:var(--mute);font-size:12.5px;white-space:nowrap}
.modal{position:absolute;inset:0;background:rgba(227,218,200,.82);display:none;place-items:center;padding:20px;z-index:5}
.modal.on{display:grid}
.sheet{background:var(--paper);border:1px solid var(--ink);border-radius:6px;padding:22px 26px;width:min(430px,100%);box-shadow:5px 6px 0 rgba(47,38,30,.14)}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}
.sheet .hand{color:var(--red)}
.sheet hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.sheet .tot{font-weight:700;font-size:17px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;white-space:nowrap}
.toast.on{opacity:1}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{order:2;border-right:0;border-top:1px solid var(--line);max-height:none}
  .paper{padding:14px 12px}.paper h1{font-size:26px}
}
</style>

function poly(c,pts,fill,stroke){c.beginPath();for(let i=0;i<pts.length;i++)i?c.lineTo(pts[i][0],pts[i][1]):c.moveTo(pts[i][0],pts[i][1]);c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke===true?LINE:stroke;c.stroke();}}
function box(c,x,y,w,d,h,z,col,ln=true){
  poly(c,[iso(x,y+d,z),iso(x+w,y+d,z),iso(x+w,y+d,z+h),iso(x,y+d,z+h)],shade(col,-13),ln);
  poly(c,[iso(x+w,y,z),iso(x+w,y+d,z),iso(x+w,y+d,z+h),iso(x+w,y,z+h)],shade(col,-26),ln);
  poly(c,[iso(x,y,z+h),iso(x+w,y,z+h),iso(x+w,y+d,z+h),iso(x,y+d,z+h)],col,ln);}

function drawLotBase(c,l){

function freeSegs(L,gaps){let iv=[[0,L]];
  gaps.forEach(g=>{const a=g-.55,b=g+.55;iv=iv.flatMap(([s,e])=>e<=a||s>=b?[[s,e]]:[[s,Math.max(s,a)],[Math.min(e,b),e]].filter(q=>q[1]-q[0]>.02));});
  const out=[];iv.forEach(([s,e])=>{for(let u=s;u<e-1e-6;u+=1)out.push([u,Math.min(u+1,e)]);});return out;}
/* low near walls (with door gaps on the street side) + striped awning over the door side */
function nearWalls(l){const h=l.part,wl=wallCol(l),{x0,y0,x1,y1,L,D}=l;
  if(l.f==='xMin'){addBox(x1-.1,y0,.1,L,h,0,wl);addBox(x0,y1-.1,D,.1,h,0,wl);}
  else if(l.f==='xMax'){
    freeSegs(L,l.doorUs).forEach(([a,b])=>addBox(x1-.1,y1-b,.1,b-a,h,0,wl));
    addBox(x0,y1-.1,D,.1,h,0,wl);
    if(l.kind!=='empty')for(let u=0;u<L-1e-6;u++){const ya=y1-Math.min(u+1,L),yb=y1-u,col=u%2?l.ac:'#F3ECDC';
      E.push({b:band(x1+.3,(ya+yb)/2),k:x1+.6+yb,d:c=>{poly(c,[iso(x1,ya,10),iso(x1,yb,10),iso(x1+.6,yb,8),iso(x1+.6,ya,8)],col,true);
        poly(c,[iso(x1+.6,ya,8),iso(x1+.6,yb,8),iso(x1+.6,yb,6.6),iso(x1+.6,ya,6.6)],shade(col,-26),true);}});}
  }else{
    freeSegs(L,l.f==='yMax'?l.doorUs:[]).forEach(([a,b])=>addBox(x0+a,y1-.1,b-a,.1,h,0,wl));
    addBox(x1-.1,y0,.1,D,h,0,wl);
    if(l.f==='yMax'&&l.kind!=='empty')for(let u=0;u<L-1e-6;u++){const xa=x0+u,xb=x0+Math.min(u+1,L),col=u%2?l.ac:'#F3ECDC';
      E.push({b:band((xa+xb)/2,y1+.3),k:xb+y1+.2,d:c=>{poly(c,[iso(xa,y1,10),iso(xb,y1,10),iso(xb,y1+.6,8),iso(xa,y1+.6,8)],col,true);
        poly(c,[iso(xa,y1+.6,8),iso(xb,y1+.6,8),iso(xb,y1+.6,6.6),iso(xa,y1+.6,6.6)],shade(col,-14),true);}});}
  }}
function layEntities(l,els,sofaCol){

    else if(t==='bar'){const k=.42;addBoxL(l,a,b,c2,b+k,6,0,'#9A6B43');addBoxL(l,a,d-k,c2,d,6,0,'#9A6B43');addBoxL(l,a,b+k,a+k,d-k,6,0,'#9A6B43');addBoxL(l,c2-k,b+k,c2,d-k,6,0,'#9A6B43');
      const mu=(a+c2)/2,mv=(b+d)/2;addBoxL(l,mu-.45,mv-.18,mu+.45,mv+.18,8.5,0,'#4E3A36');
      const[px,py]=Lw(l,mu-Math.min(.9,(c2-a)/2-.6),mv);put(px,py,c=>{const[sx,sy]=iso(px,py);drawPerson(c,sx,sy,{shirt:'#F0E8D6',hair:'#2b211b',skin:'#C99670'});});
      const[qx,qy]=Lw(l,mu,mv+.18);put(qx,qy+.3,c=>{for(let i=0;i<5;i++){const[sx,sy]=iso(qx-.36+i*.18,qy,8.5);c.fillStyle=pickC(i+ei);c.fillRect(sx-.6,sy-2.4,1.2,2.4);}});}
    else if(t==='sofa'){const w=c2-a,h=d-b;addBoxL(l,a,b,c2,d,2.6,0,sofaCol);
      const bk=shade(sofaCol,-18);

      else{if(a<l.L-c2)addBoxL(l,a,b,a+.14,d,5.6,0,bk);else addBoxL(l,c2-.14,b,c2,d,5.6,0,bk);}}
    else if(t==='rt'){const[x,y]=Lw(l,a,b);put(x,y+.25,c=>{box(c,x-.06,y-.06,.12,.12,3.6,0,'#6b5a4a',false);const[sx,sy]=iso(x,y,3.8);c.fillStyle='#E0C9A0';c.beginPath();c.ellipse(sx,sy,5.6,2.9,0,0,7);c.fill();c.strokeStyle=LINE;c.stroke();});}
    else if(t==='tb')addBoxL(l,a,b,c2,d,3,0,'#C9A77C');
    else if(t==='stairs'){for(let k=0;k<4;k++)addBoxL(l,a,d-(d-b)*(k+1)/4,c2,d-(d-b)*k/4,2.6*(k+1),0,'#B9A48C');}

    else if(t==='room'){const th=.08;addBoxL(l,a,b,c2,b+th,8,0,'#D9CFC0');addBoxL(l,a,d-th,c2,d,8,0,'#D9CFC0');if(c2<l.L-.05)addBoxL(l,c2-th,b,c2,d,8,0,'#D9CFC0');if(a>.05)addBoxL(l,a,b,a+th,d,8,0,'#D9CFC0');}
    else if(t==='work'){const[x,y]=Lw(l,(a+c2)/2,(b+d)/2);if(l.kind!=='mine')put(x,y,c=>{const[sx,sy]=iso(x,y);drawPerson(c,sx,sy,{shirt:'#3a332d',hair:'#2b211b',skin:'#D7A47C',f:ei%2===0});});}
  });

}

  ctx.fillStyle='rgba(247,242,230,.82)';ctx.fillRect(0,0,236,86);
  if(n<.5){ctx.fillStyle='#E2B24A';ctx.beginPath();ctx.arc(cx+9,cy-8,6,0,7);ctx.fill();ctx.strokeStyle='#E2B24A';ctx.lineWidth=1.2;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.moveTo(cx+9+Math.cos(a)*9,cy-8+Math.sin(a)*9);ctx.lineTo(cx+9+Math.cos(a)*12,cy-8+Math.sin(a)*12);}ctx.stroke();}
  else{ctx.fillStyle='#4A5A86';ctx.beginPath();ctx.arc(cx+9,cy-8,8,0,7);ctx.fill();ctx.fillStyle='#F7F2E6';ctx.beginPath();ctx.arc(cx+13,cy-11,7,0,7);ctx.fill();}
  ctx.fillStyle=INK;ctx.font='26px '+HAND;ctx.fillText(part+' '+(h%12||12)+':'+String(mi).padStart(2,'0'),cx+28,cy);
  const open=G.lots.filter(lit).length,street=G.peds.filter(p=>p.st==='walk'||p.st==='path').length;
  ctx.font='16px '+HAND;ctx.fillText(open+' 家亮着灯 · 路上 '+street+' 人',cx,cy+24);
  ctx.fillStyle='#7A6D5E';ctx.font='14px '+HAND;ctx.fillText('人气 × '+buzz().toFixed(2)+(G.flyers?' · 传单生效中':''),cx,cy+43);
}

/* ---------- input ---------- */
function logical(ev){const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H];}
function pickLot(mx,my){const ix=(mx-W/2)/cam.s+cam.cx,iy=(my-H/2)/cam.s+cam.cy,x=(ix/TW+iy/TH)/2,y=(iy/TH-ix/TW)/2;
  for(const d of[0,.4,.8,1.1])for(let i=G.lots.length-1;i>=0;i--){const l=G.lots[i],xx=x+d,yy=y+d;if(xx>=l.x0&&xx<=l.x1&&yy>=l.y0&&yy<=l.y1)return i;}
  return -1;}
cv.addEventListener('click',ev=>{if(G.modal)return;const[mx,my]=logical(ev),i=pickLot(mx,my);
  if(i<0){if(G.view!=null){G.view=null;camTo=overview();renderPanel();}return;}
  focus(i);renderPanel();});
cv.addEventListener('mousemove',ev=>{const[mx,my]=logical(ev);cv.style.cursor=pickLot(mx,my)>=0||G.view!=null?'pointer':'default';});
$('zall').addEventListener('click',()=>act('back'));

/* ---------- loop ---------- */
let last=performance.now(),lt=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  update(dt);
  if(camTo){const k=Math.min(1,dt*6);cam.s+=(camTo.s-cam.s)*k;cam.cx+=(camTo.cx-cam.cx)*k;cam.cy+=(camTo.cy-cam.cy)*k;
    if(Math.abs(camTo.s-cam.s)<.003&&Math.abs(camTo.cx-cam.cx)<.4&&Math.abs(camTo.cy-cam.cy)<.4){Object.assign(cam,camTo);camTo=null;}}
  render();
  if(now-lt>300){lt=now;live();}
  requestAnimationFrame(frame);}
if(!load())newGame();
resize();renderPanel();
AU.music(dayTrack());window.__AU=AU;window.__G=()=>G;window.__act=act;window.__brief=n=>showBrief(n);window.__cam=cam;
requestAnimationFrame(frame);
})();
</script>
